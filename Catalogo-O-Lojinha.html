<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Lôjinha</title>
<style>
  :root{--gold:#c39b3f;--gold-d:#a67f28;--ink:#26221b;--muted:#8a8272;--bg:#f6f3ec;--card:#fff;--line:#e7e0d2;--ok:#2e7d5b}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(120deg,#1f1b14,#3a3122);color:#f6efdd;padding:22px 20px;text-align:center}
  header .nome{font-size:26px;font-weight:800;letter-spacing:.5px}
  header .nome span{color:var(--gold)}
  header .tg{color:#cabfa8;font-size:13px;margin-top:4px}
  .bar{position:sticky;top:0;z-index:20;background:#efe9dc;border-bottom:1px solid var(--line);padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  .chip{border:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:#6b6353}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bar input{padding:8px 12px;border:1px solid var(--line);border-radius:999px;min-width:200px;font:inherit}
  main{max-width:1150px;margin:0 auto;padding:18px 16px 130px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(60,50,20,.08);display:flex;flex-direction:column}
  .prod .ph{aspect-ratio:1/1;background:#efe9dc;display:flex;align-items:center;justify-content:center;color:#cdbf98;font-size:40px}
  .prod img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .prod .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .pill{align-self:flex-start;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.4px}
  .t-ANEL{background:#efe3ff;color:#6b3fa0}.t-BRINCO{background:#e2f0ff;color:#2c6ca8}.t-COLAR{background:#fff0dd;color:#a6641c}
  .t-PULSEIRA{background:#e2f7ea;color:#227a4e}.t-PIERCING{background:#ffe6ec;color:#b23b5b}.t-BRACELETE{background:#e6f6ff;color:#1f7a94}.t-OUTRO{background:#eee;color:#666}
  .ref{font-weight:700;font-size:14px}
  .price{font-size:18px;font-weight:800;color:var(--ink)}
  .usd{font-size:12px;color:var(--ok);font-weight:700}
  .estq{font-size:11px;color:var(--muted)}
  .addrow{display:flex;gap:6px;margin-top:auto;align-items:center}
  .addrow button{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:8px;font-size:16px;font-weight:800;cursor:pointer;color:#6b6353}
  .addrow .q{flex:1;text-align:center;font-weight:700}
  .add{width:100%;border:0;background:var(--gold);color:#2a2310;font-weight:800;padding:9px;border-radius:9px;cursor:pointer;margin-top:8px}
  .add:hover{background:var(--gold-d);color:#fff}
  .cart{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--gold);box-shadow:0 -4px 20px rgba(0,0,0,.1);padding:12px 16px;z-index:30}
  .cart .in{max-width:1150px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .cart .tot{font-size:20px;font-weight:800}
  .cart .tot small{font-size:13px;color:var(--ok);font-weight:700;margin-left:6px}
  .cart .cnt{color:var(--muted);font-size:13px}
  .btn{border:0;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer}
  .btn.wa{background:#25d366;color:#08331b}
  .btn.wa:hover{background:#1eb457}
  .btn.gh{background:#efe9dc;color:#5f5747}
  .empty{color:var(--muted);text-align:center;padding:40px}
  dialog{border:0;border-radius:14px;max-width:560px;width:94vw;padding:0}
  dialog::backdrop{background:rgba(30,25,15,.45)}
  .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dbd{padding:18px;max-height:60vh;overflow:auto}
  .df{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0ebdf;font-size:14px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px}
  label.f input,label.f select{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:700}
  @media print{.bar,.cart,.add,.addrow{display:none!important}main{padding-bottom:20px}}
</style>
</head>
<body>
<header>
  <div class="nome" id="hNome">Lôjinha <span>✦</span></div>
  <div class="tg">Semijoias &amp; Folheados · Selecione as peças e monte seu pedido</div>
</header>
<div class="bar" id="bar"></div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">Nenhuma peça encontrada.</div></main>

<div class="cart">
  <div class="in">
    <div><div class="tot" id="ctTot">R$ 0,00 <small id="ctUsd">US$ 0.00</small></div><div class="cnt" id="ctCnt">Nenhum item selecionado</div></div>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn gh" onclick="openCart()">Ver pedido</button>
      <button class="btn wa" onclick="enviarWhats()">Enviar pedido no WhatsApp</button>
    </div>
  </div>
</div>

<dialog id="cartDlg">
  <div class="dh"><strong>Seu pedido</strong><button class="mini" onclick="cartDlg.close()">✕</button></div>
  <div class="dbd">
    <label class="f">Seu nome <input id="cliNome" placeholder="Nome completo"></label>
    <label class="f">Cidade/UF (opcional) <input id="cliCidade" placeholder="Cidade - UF"></label>
    <label class="f">Forma de pagamento de preferência
      <select id="cliPag"><option>Pix</option><option>Débito</option><option>Crédito à vista</option><option>Crédito parcelado</option><option>A combinar</option></select></label>
    <div id="cartList" style="margin-top:8px"></div>
  </div>
  <div class="df">
    <button class="btn gh" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn wa" onclick="enviarWhats()">Enviar no WhatsApp</button>
  </div>
</dialog>

document.getElementById('hNome').innerHTML = (DATA.loja.nome||'Lôjinha') + ' <span>✦</span>';
const money=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=v=>'US$ '+(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cart={}; // ref -> qty
let filtro='TODOS', busca='';
const tipos=['TODOS',...[...new Set(DATA.itens.map(i=>i.tipo))]];
function renderBar(){
  document.getElementById('bar').innerHTML =
    tipos.map(t=>`<button class="chip ${filtro===t?'active':''}" onclick="filtro='${t}';renderBar();renderGrid()">${t==='TODOS'?'Todas':t}</button>`).join('')
    + `<input placeholder="Buscar referência..." value="${busca}" oninput="busca=this.value;renderGrid()">`;
}
function visiveis(){
  return DATA.itens.filter(i=>(filtro==='TODOS'||i.tipo===filtro) && (!busca.trim()||(i.ref||'').toLowerCase().includes(busca.toLowerCase())));
}
function renderGrid(){
  const list=visiveis();
  document.getElementById('empty').style.display=list.length?'none':'block';
  document.getElementById('grid').innerHTML=list.map(i=>{
    const q=cart[i.ref]||0;
    const foto=i.foto?`<img src="${(i.foto+'').replace(/"/g,'&quot;')}" onerror="this.outerHTML='<div class=ph>✦</div>'">`:`<div class="ph">✦</div>`;
    return `<div class="prod">${foto}<div class="body">
      <span class="pill t-${i.tipo||'OUTRO'}">${i.tipo||''}</span>
      <div class="ref">${i.ref||''}</div>
      <div class="price">${money(i.brl)} <span class="usd">${usd(i.usd)}</span></div>
      <div class="estq">${i.estoque} em estoque</div>
      ${q>0?`<div class="addrow"><button onclick="chg('${i.ref}',-1)">−</button><span class="q">${q}</span><button onclick="chg('${i.ref}',1)">＋</button></div>`
           :`<button class="add" onclick="chg('${i.ref}',1)">Adicionar</button>`}
    </div></div>`;
  }).join('');
}
function chg(ref,d){
  const it=DATA.itens.find(x=>x.ref===ref);const max=it?it.estoque:99;
  cart[ref]=Math.max(0,Math.min(max,(cart[ref]||0)+d));
  if(cart[ref]===0)delete cart[ref];
  renderGrid();renderCart();
}
function lines(){return Object.keys(cart).map(ref=>{const it=DATA.itens.find(x=>x.ref===ref);return{it,q:cart[ref]};});}
function totals(){let brl=0,u=0,n=0;lines().forEach(l=>{brl+=l.it.brl*l.q;u+=l.it.usd*l.q;n+=l.q;});return{brl,u,n};}
function renderCart(){
  const t=totals();
  document.getElementById('ctTot').innerHTML=`${money(t.brl)} <small id="ctUsd">${usd(t.u)}</small>`;
  document.getElementById('ctCnt').textContent=t.n?`${t.n} peça(s) selecionada(s)`:'Nenhum item selecionado';
}
function openCart(){
  const ls=lines();
  document.getElementById('cartList').innerHTML= ls.length? ls.map(l=>`<div class="li"><span>${l.q}x ${l.it.ref} <small style="color:#8a8272">(${l.it.tipo})</small></span><span>${money(l.it.brl*l.q)}</span></div>`).join('')
    + `<div class="li" style="border:0;font-weight:800;font-size:16px"><span>Total</span><span>${money(totals().brl)} <small style="color:#2e7d5b">${usd(totals().u)}</small></span></div>`
    : '<p style="color:#8a8272">Seu pedido está vazio. Toque em “Adicionar” nas peças.</p>';
  document.getElementById('cartDlg').showModal();
}
function pedidoTexto(){
  const ls=lines();if(!ls.length)return null;
  const nome=document.getElementById('cliNome').value.trim();
  const cidade=document.getElementById('cliCidade').value.trim();
  const pag=document.getElementById('cliPag').value;
  let m=`*Pedido — ${DATA.loja.nome||'Lôjinha'}*\n`;
  if(nome)m+=`Cliente: ${nome}\n`;
  if(cidade)m+=`Cidade: ${cidade}\n`;
  m+=`\n`;
  ls.forEach(l=>{m+=`• ${l.q}x ${l.it.ref} (${l.it.tipo}) — ${money(l.it.brl*l.q)}\n`;});
  const t=totals();
  m+=`\n*Total: ${money(t.brl)}* (${usd(t.u)})\n`;
  m+=`Pagamento: ${pag}`;
  return m;
}
function enviarWhats(){
  const txt=pedidoTexto();
  if(!txt){alert('Adicione peças ao pedido primeiro.');return;}
  const whats=(DATA.loja.whats||'').replace(/\D/g,'');
  const url = whats ? `https://wa.me/${whats}?text=${encodeURIComponent(txt)}` : `https://wa.me/?text=${encodeURIComponent(txt)}`;
  window.open(url,'_blank');
}
renderBar();renderGrid();renderCart();
