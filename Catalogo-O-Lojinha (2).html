<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lôjinha da Lee — Catálogo em reforma</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at top,#3a2c1c 0%,#1f170f 70%);color:#f3ead8;
    font-family:'Montserrat',sans-serif;text-align:center}
  .card{max-width:520px}
  .mono{width:96px;height:96px;margin:0 auto 22px;border:1.5px solid #c9a45c;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;
    font-size:44px;color:#d9b66b}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.14em;font-size:34px;color:#d9b66b}
  .lee{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:#d9b66b;margin-top:-4px}
  .sub{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#b89a63;margin-top:6px}
  hr{border:0;height:1px;width:80px;background:#c9a45c;margin:30px auto}
  h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:28px;margin-bottom:12px}
  p{font-size:15px;line-height:1.7;color:#e2d5bb}
</style>
</head>
<body>
  <div class="card">
    <div class="mono">L</div>
    <h1>LÔJINHA</h1>
    <div class="lee">da Lee</div>
    <div class="sub">Semijoias &amp; Folheados</div>
    <hr>
    <h2>Catálogo em reforma</h2>
    <p>Estamos preparando um catálogo novo, com mais peças e novidades.<br>Volte em breve!</p>
  </div>
</body>
</html>
