    --shadow:0 1px 3px rgba(60,50,20,.08),0 6px 20px rgba(60,50,20,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header.top{background:linear-gradient(120deg,#1f1b14,#3a3122);color:#f6efdd;padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
  header.top .brand{font-weight:700;font-size:18px;letter-spacing:.5px}
  header.top .brand span{color:var(--gold)}
  header.top .sub{color:#cabfa8;font-size:12px;opacity:.8}
  nav{display:flex;gap:4px;flex-wrap:wrap;background:#efe9dc;padding:8px 14px;position:sticky;top:52px;z-index:40;border-bottom:1px solid var(--line)}
  nav button{border:0;background:transparent;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:14px;color:#6b6353;font-weight:600}
  nav button:hover{background:#e3dccb}
  nav button.active{background:var(--ink);color:#fff}
  main{padding:20px;max-width:1250px;margin:0 auto}
  h2.page{margin:0 0 4px;font-size:22px}
  .pg-sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .pad{padding:16px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .kpi{padding:16px}
  .kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:700;margin-top:4px}
  .kpi .val.sm{font-size:20px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
  button.btn{border:0;background:var(--gold);color:#2a2310;font-weight:700;padding:9px 15px;border-radius:8px;cursor:pointer}
  button.btn:hover{background:var(--gold-d);color:#fff}
  button.btn.ghost{background:#efe9dc;color:#5f5747}
  button.btn.ghost:hover{background:#e3dccb;color:#3a3222}
  button.btn.sm{padding:5px 10px;font-size:12px}
  button.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-weight:700;color:#6b6353}
  button.mini:hover{background:#f0ebdf}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:#faf7f0;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);z-index:1}
  tr:hover td{background:#fcfaf4}
  .tblwrap{overflow:auto;max-height:70vh;border-radius:12px}
  .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#efe9dc;border:1px solid var(--line);display:block}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:#c3b58f;font-size:16px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .t-ANEL{background:#efe3ff;color:#6b3fa0}.t-BRINCO{background:#e2f0ff;color:#2c6ca8}
  .t-COLAR{background:#fff0dd;color:#a6641c}.t-PULSEIRA{background:#e2f7ea;color:#227a4e}
  .t-PIERCING{background:#ffe6ec;color:#b23b5b}.t-BRACELETE{background:#e6f6ff;color:#1f7a94}.t-OUTRO{background:#eee;color:#666}
  .money{font-variant-numeric:tabular-nums}
  .usd{color:var(--ok);font-weight:600}
  .neg{color:var(--danger)}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:12px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:#efe9dc;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
  .chip.active{background:var(--ink);color:#fff}
  .stockbar{height:6px;border-radius:4px;background:#eee;overflow:hidden;min-width:60px}
  .stockbar>i{display:block;height:100%;background:var(--ok)}
  dialog{border:0;border-radius:14px;padding:0;box-shadow:0 10px 50px rgba(0,0,0,.3);max-width:620px;width:94vw}
  dialog::backdrop{background:rgba(30,25,15,.45)}
  .dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dlg-b{padding:18px;max-height:70vh;overflow:auto}
  .dlg-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .center{text-align:center}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700}
  .tag.aberto{background:#fff0dd;color:#a6641c}.tag.vendido{background:#e2f7ea;color:#227a4e}.tag.cancelado{background:#f2f2f2;color:#999}
  .split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
  @media(max-width:820px){.split{grid-template-columns:1fr}.form2{grid-template-columns:1fr}}
  .hint{font-size:12px;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;z-index:99;box-shadow:var(--shadow);pointer-events:none}
  .toast.show{opacity:1}
  canvas{max-width:100%}
  .orc-print{display:none}
  @media print{
    header.top,nav,.noprint{display:none!important}
    body{background:#fff}
    main{max-width:100%;padding:0}
    .orc-print{display:block}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Lôjinha <span style="color:var(--gold)">&#10038;</span></div>
  <div class="sub">Controle de peças</div>
  <div style="margin-left:auto" class="noprint row">
    <button class="btn ghost sm" onclick="exportJSON()">&#11015; Backup</button>
    <button class="btn ghost sm" onclick="document.getElementById('impFile').click()">&#11014; Restaurar</button>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importJSON(this)">
  </div>
</header>
<nav class="noprint" id="nav"></nav>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div id="printArea" class="orc-print"></div>

<dialog id="itemDlg">
  <form method="dialog" onsubmit="saveItem(event)">
    <div class="dlg-h"><strong id="itemDlgTitle">Peça</strong><button class="mini" value="cancel">&#10005;</button></div>
    <div class="dlg-b">
      <div class="form2">
        <label class="fld">Descrição / Tipo
          <select id="f_tipo"><option>ANEL</option><option>BRINCO</option><option>COLAR</option><option>PULSEIRA</option><option>BRACELETE</option><option>PIERCING</option><option>OUTRO</option></select></label>
        <label class="fld">Código 2 (etiqueta da caixinha) <input id="f_cod2"></label>
        <label class="fld">Referência <input id="f_ref"></label>
        <label class="fld">Cód. etiqueta (interno) <input id="f_cod"></label>
        <label class="fld">Fornecedor <input id="f_fornecedor"></label>
        <label class="fld">Peso (g) <input id="f_pesoG" type="number" step="0.01"></label>
        <label class="fld">Valor bruto (R$) <input id="f_bruto" type="number" step="0.01"></label>
        <label class="fld">Metal (R$) <input id="f_metal" type="number" step="0.01"></label>
        <label class="fld">Embalagem (R$) <input id="f_embalagem" type="number" step="0.01"></label>
        <label class="fld">Markup (x) <input id="f_markup" type="number" step="0.1"></label>
        <label class="fld">Saldo inicial <input id="f_saldoInicial" type="number" step="1"></label>
      </div>
      <label class="fld" style="margin-top:12px">Foto (link ou caminho do arquivo)
        <input id="f_foto" placeholder="https://... ou C:\fotos\anel.jpg" oninput="previewFoto()"></label>
      <div class="row" style="margin-top:10px">
        <img id="f_fotoPrev" class="thumb ph" style="width:64px;height:64px" alt="">
        <div class="hint">Cole um link (URL) da foto ou o caminho no seu computador.<br>A miniatura aparece se o navegador conseguir carregar a imagem.</div>
      </div>
      <div class="card pad" style="margin-top:12px;background:#faf7f0">
        <div class="row between"><span class="muted">Custo (bruto −<span id="calc_desc">20</span>% + metal + embalagem)</span><strong id="calc_custo">—</strong></div>
        <div class="row between"><span class="muted">Preço venda (R$)</span><strong id="calc_brl">—</strong></div>
        <div class="row between"><span class="muted">Preço venda (US$)</span><strong class="usd" id="calc_usd">—</strong></div>
      </div>
      <input type="hidden" id="f_id">
    </div>
    <div class="dlg-f">
      <button class="btn ghost" value="cancel" type="button" onclick="itemDlg.close()">Cancelar</button>
      <button class="btn" value="ok">Salvar peça</button>
    </div>
  </form>
</dialog>

<dialog id="movDlg">
  <form method="dialog" onsubmit="saveMov(event)">
    <div class="dlg-h"><strong id="movTitle">Movimentar estoque</strong><button class="mini" value="cancel">&#10005;</button></div>
    <div class="dlg-b">
      <div id="movItemInfo" class="card pad" style="background:#faf7f0;margin-bottom:12px"></div>
      <div class="form2">
        <label class="fld">Tipo
          <select id="m_tipo"><option value="entrada">Entrada (+)</option><option value="saida">Saída (−)</option></select></label>
        <label class="fld">Quantidade <input id="m_qtd" type="number" step="1" min="1" value="1"></label>
        <label class="fld">Data <input id="m_data" type="date"></label>
        <label class="fld">Motivo
          <select id="m_motivo"><option>Ajuste</option><option>Compra/reposição</option><option>Venda avulsa</option><option>Perda/quebra</option><option>Devolução</option></select></label>
      </div>
      <label class="fld" style="margin-top:12px">Observação <input id="m_obs"></label>
      <input type="hidden" id="m_itemId">
    </div>
    <div class="dlg-f">
      <button class="btn ghost" value="cancel" type="button" onclick="movDlg.close()">Cancelar</button>
      <button class="btn" value="ok">Registrar</button>
    </div>
  </form>
</dialog>

function seedToItem(s){return {kit:s.kit||1,fornecedor:s.fornecedor,ref:s.ref,cod:s.cod,cod2:s.cod2,
  tipo:TIPOS.includes(s.tipo)?s.tipo:'OUTRO',bruto:s.bruto||0,metal:s.metal||0,embalagem:s.embalagem||0,
  pesoG:s.pesoG||0,markup:3,foto:'',qtd:s.qtd||0,saldoInicial:(s.disponivel? (s.qtd||0):0)};}
function keyOf(i){return [i.kit||1,i.cod||'',i.cod2||'',i.ref||''].join('|');}
function defaultState(){
  return {
    params:{ usd:5.40, ouro:750, markup:3, descBruto:20, loja:{nome:'Lôjinha', whatsapp:'', validade:7, cnpj:'', endereco:''}, etiqueta:{ip:'192.168.1.50', porta:9100, wmm:50, hmm:25, gapmm:2} },
    items: SEED_ITEMS.map((s,ix)=>({ id:ix+1, ...seedToItem(s) })),
    movimentos:[], orcamentos:[], seqOrc:1
  };
}
function migrate(d){
  d.params=d.params||{};
  if(d.params.usd==null)d.params.usd=5.40;
  if(d.params.ouro==null)d.params.ouro=750;
  if(d.params.markup==null)d.params.markup=3;
  if(d.params.descBruto==null)d.params.descBruto=20;
  if(!d.params.loja)d.params.loja={nome:'Lôjinha',whatsapp:'',validade:7,cnpj:'',endereco:''};
  if(!d.params.etiqueta)d.params.etiqueta={ip:'192.168.1.50',porta:9100,wmm:50,hmm:25,gapmm:2};
  d.items=d.items||[];d.movimentos=d.movimentos||[];d.orcamentos=d.orcamentos||[];
  if(!d.seqOrc)d.seqOrc=(Math.max(0,...d.orcamentos.map(o=>o.numero||0))+1)||1;
  // upgrade: itens do modelo antigo (banho) para o novo (metal)
  const seedByKey={}; SEED_ITEMS.forEach(s=>seedByKey[keyOf(seedToItem(s))]=s);
  d.items.forEach(it=>{
    if(it.metal===undefined){
      const s=seedByKey[keyOf(it)];
      if(s){it.bruto=s.bruto;it.metal=s.metal;it.embalagem=s.embalagem;it.pesoG=s.pesoG;if(!it.cod2)it.cod2=s.cod2;}
      else{it.metal=0;}
      delete it.banho1; delete it.banho3; delete it.investimento; delete it.sugerido;
    }
  });
  const have=new Set(d.items.map(keyOf));
  let maxId=Math.max(0,...d.items.map(i=>i.id||0));
  SEED_ITEMS.forEach(s=>{const it=seedToItem(s);if(!have.has(keyOf(it))){d.items.push({id:++maxId,...it});have.add(keyOf(it));}});
  return d;
}
function load(){ try{const r=localStorage.getItem(LS_KEY); if(r){return migrate(JSON.parse(r));}}catch(e){} return defaultState(); }

function refreshCadTable(){
  const rows=cadRows();
  const head=`<tr><th>Foto</th><th>Tipo</th><th>Código 2</th><th>Ref</th><th>Fornecedor</th><th class="right">Custo</th><th class="right">Markup</th><th class="right">Preço R$</th><th class="right">Preço US$</th><th class="right">Estoque</th><th class="right noprint">Ações</th></tr>`;
  const body=rows.map(i=>`<tr>
    <td>${fotoThumb(i)}</td>
    <td><span class="pill t-${TIPOS.includes(i.tipo)?i.tipo:'OUTRO'}">${i.tipo}</span></td>
    <td><span class="code">${i.cod2||'—'}</span> <span class="muted" style="font-size:10px">K${i.kit||1}</span></td>
    <td>${i.ref||''}</td><td>${i.fornecedor||''}</td>
    <td class="right money">${BRL(custo(i))}</td>
    <td class="right">${markupOf(i)}x</td>
    <td class="right money"><b>${BRL(precoBRL(i))}</b></td>
    <td class="right money usd">${USD(precoUSD(i))}</td>
    <td class="right ${saldo(i)<=0?'neg':''}">${saldo(i)<=0?'sem estoque':NUM(saldo(i))}</td>
    <td class="right noprint"><button class="mini" onclick="openItem(${i.id})">editar</button></td>
  </tr>`).join('');
  const foot=`<tr><th colspan="7">${rows.length} peça(s)</th><th class="right">${BRL(rows.reduce((s,i)=>s+precoBRL(i)*saldo(i),0))}</th><th></th><th class="right">${NUM(rows.reduce((s,i)=>s+saldo(i),0))}</th><th class="noprint"></th></tr>`;
  document.getElementById('cadTable').innerHTML=head+body+foot;
}
function fotoThumb(i){
  if(i.foto) return `<img class="thumb" src="${i.foto.replace(/"/g,'&quot;')}" onerror="this.classList.add('ph');this.removeAttribute('src');this.textContent='✦'" alt="">`;
  return `<span class="thumb ph">✦</span>`;
}

function openItem(id){
  const dlg=document.getElementById('itemDlg');
  const it=id?itemById(id):{tipo:'ANEL',markup:db.params.markup,saldoInicial:0};
  document.getElementById('f_id').value=id||'';
  const set=(k,v)=>document.getElementById('f_'+k).value=(v==null?'':v);
  set('tipo',it.tipo);set('fornecedor',it.fornecedor);set('ref',it.ref);set('cod',it.cod);set('cod2',it.cod2);
  set('pesoG',it.pesoG);set('bruto',it.bruto);set('metal',it.metal);set('embalagem',it.embalagem);
  set('markup',it.markup==null?db.params.markup:it.markup);set('saldoInicial',it.saldoInicial);set('foto',it.foto);
  document.getElementById('itemDlgTitle').textContent=id?'Editar peça':'Nova peça';
  document.getElementById('calc_desc').textContent=descBrutoPct();
  ['bruto','metal','embalagem','markup'].forEach(k=>document.getElementById('f_'+k).oninput=calcItem);
  calcItem();previewFoto();
  dlg.showModal();
}
function calcItem(){
  const g=k=>+document.getElementById('f_'+k).value||0;
  const c=g('bruto')*(1-descBrutoPct()/100)+g('metal')+g('embalagem');
  const mk=+document.getElementById('f_markup').value||db.params.markup;
  const brl=c*mk;
  document.getElementById('calc_custo').textContent=BRL(c);
  document.getElementById('calc_brl').textContent=BRL(brl);
  document.getElementById('calc_usd').textContent=USD(brl/(+db.params.usd||1));
}
function previewFoto(){
  const v=document.getElementById('f_foto').value.trim();
  const img=document.getElementById('f_fotoPrev');
  if(v){img.classList.remove('ph');img.textContent='';img.src=v;img.onerror=()=>{img.classList.add('ph');img.removeAttribute('src');img.textContent='✦';};}
  else{img.classList.add('ph');img.removeAttribute('src');img.textContent='✦';}
}
function saveItem(e){
  const g=k=>document.getElementById('f_'+k).value;
  const gn=k=>+document.getElementById('f_'+k).value||0;
  const id=g('id');
  const data={tipo:g('tipo'),fornecedor:g('fornecedor'),ref:g('ref'),cod:g('cod'),cod2:g('cod2'),
    pesoG:gn('pesoG'),bruto:gn('bruto'),metal:gn('metal'),embalagem:gn('embalagem'),
    markup:gn('markup')||db.params.markup,saldoInicial:gn('saldoInicial'),foto:g('foto').trim()};
  if(id){Object.assign(itemById(+id),data);}
  else{const nid=Math.max(0,...db.items.map(i=>i.id))+1;db.items.push({id:nid,kit:0,qtd:data.saldoInicial,...data});}
  save();toast('Peça salva');render();
}

/* ============ ESTOQUE ============ */
function viewEstoque(){
  let rows=db.items.slice();
  if(estFilter!=='TODOS') rows=rows.filter(i=>(TIPOS.includes(i.tipo)?i.tipo:'OUTRO')===estFilter);
  const maxS=Math.max(1,...db.items.map(i=>saldo(i)));
  const table=`<div class="card"><div class="tblwrap"><table>
    <tr><th>Tipo</th><th>Código 2 / Ref</th><th class="right">Saldo inicial</th><th class="right">Entradas</th><th class="right">Saídas</th><th class="right">Saldo atual</th><th>Nível</th><th class="right noprint">Ação</th></tr>
    ${rows.map(i=>{const ent=db.movimentos.filter(m=>m.itemId===i.id&&m.tipo==='entrada').reduce((s,m)=>s+ +m.qtd,0);
      const sai=db.movimentos.filter(m=>m.itemId===i.id&&m.tipo==='saida').reduce((s,m)=>s+ +m.qtd,0);
      const sd=saldo(i);
      return `<tr>
        <td><span class="pill t-${TIPOS.includes(i.tipo)?i.tipo:'OUTRO'}">${i.tipo}</span></td>
        <td><span class="code">${i.cod2||'—'}</span> <span class="muted">${i.ref||''}</span></td>
        <td class="right">${NUM(i.saldoInicial||0)}</td>
        <td class="right" style="color:var(--ok)">+${NUM(ent)}</td>
        <td class="right" style="color:var(--danger)">−${NUM(sai)}</td>
        <td class="right"><b class="${sd<=0?'neg':''}">${NUM(sd)}</b></td>
        <td><div class="stockbar"><i style="width:${Math.min(100,sd/maxS*100)}%;background:${sd<=0?'var(--danger)':sd<5?'var(--warn)':'var(--ok)'}"></i></div></td>
        <td class="right noprint"><button class="mini" onclick="openMov(${i.id})">movimentar</button></td>
      </tr>`;}).join('')}
  </table></div></div>`;
  const movs=db.movimentos.slice().reverse().slice(0,40);
  const hist=`<div class="card pad" style="margin-top:16px"><strong>Últimas movimentações</strong>
    ${movs.length?`<div class="tblwrap" style="max-height:340px;margin-top:8px"><table>
      <tr><th>Data</th><th>Peça</th><th>Tipo</th><th class="right">Qtd</th><th>Motivo</th><th>Obs</th></tr>
      ${movs.map(m=>{const it=itemById(m.itemId);return `<tr><td>${fmtDate(m.data)}</td><td>${it?(it.cod2||it.ref)+' · '+it.tipo:'?'}</td>
        <td style="color:${m.tipo==='entrada'?'var(--ok)':'var(--danger)'}">${m.tipo==='entrada'?'Entrada':'Saída'}</td>
        <td class="right">${NUM(m.qtd)}</td><td>${m.motivo||''}</td><td class="muted">${m.obs||''}</td></tr>`;}).join('')}
    </table></div>`:'<p class="hint">Nenhuma movimentação ainda.</p>'}</div>`;
  return `<h2 class="page">Controle de estoque</h2>
  <p class="pg-sub">Saldo inicial + movimentações = saldo atual. Peças do KIT 02 fora do azul entraram com saldo 0 — registre uma <b>entrada</b> para deixá-las disponíveis. Vendas concluídas geram saídas automáticas.</p>
  <div class="row noprint" id="estChips" style="margin-bottom:12px">${chipsHTML(estFilter,'est')}</div>
  ${table}${hist}`;
}
function openMov(id){
  const it=itemById(id);
  document.getElementById('m_itemId').value=id;
  document.getElementById('movItemInfo').innerHTML=`<span class="code">${it.cod2||''}</span> · ${it.tipo} <span class="muted">${it.ref||''}</span><br><span class="muted">Saldo atual:</span> <b>${NUM(saldo(it))}</b>`;
  document.getElementById('m_data').value=new Date().toISOString().slice(0,10);
  document.getElementById('m_qtd').value=1;
  document.getElementById('movDlg').showModal();
}
function saveMov(e){
  const id=+document.getElementById('m_itemId').value;
  const mov={id:Date.now(),itemId:id,tipo:document.getElementById('m_tipo').value,
    qtd:+document.getElementById('m_qtd').value||0,data:document.getElementById('m_data').value,
    motivo:document.getElementById('m_motivo').value,obs:document.getElementById('m_obs').value};
  if(mov.qtd>0){db.movimentos.push(mov);save();toast('Movimentação registrada');}
  render();
}
function fmtDate(d){if(!d)return'';const p=(''+d).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;}

/* ============ ORÇAMENTOS ============ */
let orcDraft=null;
function newDraft(){return{cliente:'',contato:'',cpf:'',endereco:'',data:new Date().toISOString().slice(0,10),itens:[],metodo:'Pix',parcelas:1,desconto:0,descTipo:'valor',frete:0,obs:''};}
function descValor(o){const sub=o.itens.reduce((s,l)=>s+l.precoUnit*l.qtd,0);return o.descTipo==='pct'?sub*(+o.desconto||0)/100:(+o.desconto||0);}
function viewOrc(){
  const list=db.orcamentos.slice().reverse();
  return `<h2 class="page">Orçamentos</h2>
  <p class="pg-sub">Monte o orçamento, aplique desconto, e ao fechar gere o documento de cobrança para o financeiro.</p>
  <div class="split">
    <div class="card pad" id="orcBuilder"></div>
    <div class="card pad">
      <div class="row between"><strong>Orçamentos salvos</strong><span class="muted">${db.orcamentos.length}</span></div>
      ${list.length?`<div class="tblwrap" style="max-height:60vh;margin-top:8px"><table>
        <tr><th>Nº</th><th>Cliente</th><th>Data</th><th class="right">Total</th><th>Status</th><th class="noprint"></th></tr>
        ${list.map(o=>`<tr><td>#${o.numero}</td><td>${o.cliente||'—'}</td><td>${fmtDate(o.data)}</td>
          <td class="right money">${BRL(o.total)}</td><td><span class="tag ${o.status}">${o.status}</span></td>
          <td class="right noprint">
            <button class="mini" onclick="printOrc(${o.numero})">orçamento</button>
            ${o.status==='aberto'?`<button class="mini" onclick="marcarVendido(${o.numero})">✔ fechar</button>`
              :`<button class="mini" onclick="gerarCobranca(${o.numero})">📄 cobrança</button>`}
            <button class="mini" onclick="delOrc(${o.numero})">✕</button>
          </td></tr>`).join('')}
      </table></div>`:'<p class="hint">Nenhum orçamento salvo ainda.</p>'}
    </div>
  </div>`;
}
function afterOrc(){ if(!orcDraft)orcDraft=newDraft(); renderBuilder(); }
function renderBuilder(){
  const el=document.getElementById('orcBuilder');if(!el)return;
  const sub=orcDraft.itens.reduce((s,l)=>s+l.precoUnit*l.qtd,0);
  const desc=descValor(orcDraft);
  const frete=+orcDraft.frete||0;
  const total=Math.max(0,sub-desc)+frete;
  const parcela=orcDraft.metodo==='Crédito parcelado'&&orcDraft.parcelas>1?total/orcDraft.parcelas:0;
  el.innerHTML=`
    <strong>Novo orçamento</strong>
    <div class="form2" style="margin-top:10px">
      <label class="fld">Cliente <input value="${(orcDraft.cliente||'').replace(/"/g,'&quot;')}" oninput="orcDraft.cliente=this.value"></label>
      <label class="fld">Contato / telefone <input value="${(orcDraft.contato||'').replace(/"/g,'&quot;')}" oninput="orcDraft.contato=this.value"></label>
      <label class="fld">CPF / CNPJ <input value="${(orcDraft.cpf||'').replace(/"/g,'&quot;')}" oninput="orcDraft.cpf=this.value"></label>
      <label class="fld">Endereço <input value="${(orcDraft.endereco||'').replace(/"/g,'&quot;')}" oninput="orcDraft.endereco=this.value"></label>
    </div>
    <div class="row" style="margin-top:12px;align-items:flex-end">
      <label class="fld" style="flex:1">Adicionar peça
        <select id="orcAdd">
          <option value="">Selecione…</option>
          ${db.items.filter(i=>saldo(i)>0).map(i=>`<option value="${i.id}">${codigoDe(i)} · ${i.tipo} · ${BRL(precoBRL(i))} (estq ${NUM(saldo(i))})</option>`).join('')}
        </select></label>
      <button class="btn" onclick="addLinha()">＋ Add</button>
    </div>
    <div class="tblwrap" style="max-height:200px;margin-top:12px">
      <table><tr><th>Peça</th><th class="right">Preço</th><th class="center">Qtd</th><th class="right">Subtotal</th><th></th></tr>
      ${orcDraft.itens.length?orcDraft.itens.map((l,ix)=>{const it=itemById(l.itemId);return `<tr>
        <td><span class="code">${it?codigoDe(it):'?'}</span> <span class="muted">${it?it.tipo:''}</span></td>
        <td class="right money">${BRL(l.precoUnit)}</td>
        <td class="center"><input type="number" min="1" value="${l.qtd}" style="width:60px" onchange="orcDraft.itens[${ix}].qtd=Math.max(1,+this.value);renderBuilder()"></td>
        <td class="right money">${BRL(l.precoUnit*l.qtd)}</td>
        <td><button class="mini" onclick="orcDraft.itens.splice(${ix},1);renderBuilder()">✕</button></td></tr>`;}).join(''):'<tr><td colspan="5" class="hint center">Nenhuma peça adicionada.</td></tr>'}
      </table>
    </div>
    <div class="form2" style="margin-top:12px">
      <label class="fld">Desconto
        <div class="row" style="gap:6px">
          <input type="number" step="0.01" min="0" value="${orcDraft.desconto}" style="flex:1" oninput="orcDraft.desconto=+this.value||0;renderBuilder()">
          <select onchange="orcDraft.descTipo=this.value;renderBuilder()" style="width:70px">
            <option value="valor" ${orcDraft.descTipo==='valor'?'selected':''}>R$</option>
            <option value="pct" ${orcDraft.descTipo==='pct'?'selected':''}>%</option>
          </select>
        </div></label>
      <label class="fld">Frete (R$) — cotação manual
        <input type="number" step="0.01" min="0" value="${orcDraft.frete}" oninput="orcDraft.frete=+this.value||0;renderBuilder()"></label>
    </div>
    <div class="form2" style="margin-top:10px">
      <label class="fld">Método de pagamento
        <select oninput="orcDraft.metodo=this.value;renderBuilder()">
          ${['Pix','Débito','Crédito à vista','Crédito parcelado','Dinheiro (à vista)','Boleto'].map(m=>`<option ${orcDraft.metodo===m?'selected':''}>${m}</option>`).join('')}
        </select></label>
      <div></div>
    </div>
    ${orcDraft.metodo==='Crédito parcelado'?`<label class="fld" style="margin-top:10px">Parcelas
      <select oninput="orcDraft.parcelas=+this.value;renderBuilder()">${[...Array(12)].map((_,k)=>`<option value="${k+1}" ${orcDraft.parcelas===k+1?'selected':''}>${k+1}x</option>`).join('')}</select></label>`:''}
    <label class="fld" style="margin-top:10px">Observação <input value="${(orcDraft.obs||'').replace(/"/g,'&quot;')}" oninput="orcDraft.obs=this.value"></label>
    <div class="card pad" style="background:#faf7f0;margin-top:12px">
      <div class="row between"><span class="muted">Subtotal</span><span class="money">${BRL(sub)}</span></div>
      <div class="row between"><span class="muted">Desconto ${orcDraft.descTipo==='pct'?'('+(+orcDraft.desconto||0)+'%)':''}</span><span class="money">− ${BRL(desc)}</span></div>
      ${frete?`<div class="row between"><span class="muted">Frete</span><span class="money">+ ${BRL(frete)}</span></div>`:''}
      <div class="row between" style="font-size:18px"><b>Total</b><b class="money">${BRL(total)}</b></div>
      <div class="row between"><span class="muted">Método</span><span>${metodoLabel(orcDraft)}</span></div>
      ${parcela?`<div class="row between"><span class="muted">Parcela</span><span>${orcDraft.parcelas}x de ${BRL(parcela)}</span></div>`:''}
      <div class="row between"><span class="muted">Total em US$</span><span class="usd">${USD(total/(+db.params.usd||1))}</span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="salvarOrc()">Salvar orçamento</button>
      <button class="btn ghost" onclick="orcDraft=newDraft();renderBuilder()">Limpar</button>
    </div>`;
}
function addLinha(){
  const sel=document.getElementById('orcAdd');const id=+sel.value;if(!id)return;
  const it=itemById(id);const ex=orcDraft.itens.find(l=>l.itemId===id);
  if(ex)ex.qtd++;else orcDraft.itens.push({itemId:id,qtd:1,precoUnit:+precoBRL(it).toFixed(2)});
  renderBuilder();
}
function metodoLabel(o){return o.metodo==='Crédito parcelado'&&o.parcelas>1?`Crédito ${o.parcelas}x`:o.metodo;}
function salvarOrc(){
  if(!orcDraft.itens.length){toast('Adicione ao menos uma peça');return;}
  const sub=orcDraft.itens.reduce((s,l)=>s+l.precoUnit*l.qtd,0);
  const desc=descValor(orcDraft);
  const frete=+orcDraft.frete||0;
  const total=Math.max(0,sub-desc)+frete;
  const o={...orcDraft,descValor:+desc.toFixed(2),frete:+frete.toFixed(2),numero:db.seqOrc++,total,status:'aberto',criadoEm:Date.now()};
  db.orcamentos.push(o);save();orcDraft=newDraft();toast('Orçamento salvo');render();
}
function delOrc(n){const o=db.orcamentos.find(x=>x.numero===n);if(!o)return;
  if(!confirm('Remover orçamento #'+n+'?'))return;
  if(o.status==='vendido'){estornarVenda(o);}
  db.orcamentos=db.orcamentos.filter(x=>x.numero!==n);save();render();toast('Orçamento removido');}
function marcarVendido(n){
  const o=db.orcamentos.find(x=>x.numero===n);if(!o||o.status==='vendido')return;
  o.status='vendido';o.vendidoEm=Date.now();
  o.itens.forEach(l=>db.movimentos.push({id:Date.now()+Math.random(),itemId:l.itemId,tipo:'saida',qtd:l.qtd,data:o.data,motivo:'Venda',obs:'Pedido #'+o.numero}));
  save();render();toast('Pedido fechado — estoque baixado. Gerando cobrança…');
  setTimeout(()=>gerarCobranca(n),400);
}
function estornarVenda(o){db.movimentos=db.movimentos.filter(m=>!(m.motivo==='Venda'&&m.obs==='Pedido #'+o.numero));}

  const o=db.orcamentos.find(x=>x.numero===n);if(!o)return;
  const linhas=o.itens.map(l=>{const it=itemById(l.itemId);return `<tr><td style="padding:6px;border-bottom:1px solid #eee"><b>${it?codigoDe(it):'?'}</b> ${it?'· '+it.tipo:''}</td><td style="padding:6px;text-align:center;border-bottom:1px solid #eee">${l.qtd}</td><td style="padding:6px;text-align:right;border-bottom:1px solid #eee">${BRL(l.precoUnit)}</td><td style="padding:6px;text-align:right;border-bottom:1px solid #eee">${BRL(l.precoUnit*l.qtd)}</td></tr>`;}).join('');
  const parcela=o.metodo==='Crédito parcelado'&&o.parcelas>1?o.total/o.parcelas:0;
  const loja=db.params.loja||{};
  document.getElementById('printArea').innerHTML=`
    <div style="padding:30px;font-family:inherit;color:#26221b;max-width:760px">
      <div style="display:flex;justify-content:space-between;border-bottom:3px solid #c39b3f;padding-bottom:12px">
        <div><div style="font-size:26px;font-weight:800">${loja.nome||'Lôjinha'} ✦</div><div style="color:#8a8272">Semijoias & Folheados</div></div>
        <div style="text-align:right"><div style="font-size:20px;font-weight:700">ORÇAMENTO Nº ${o.numero}</div><div style="color:#8a8272">${fmtDate(o.data)}</div></div>
      </div>
      <div style="margin:16px 0"><b>Cliente:</b> ${o.cliente||'—'} ${o.contato?' · '+o.contato:''}</div>
      <table style="width:100%;border-collapse:collapse">
        <tr style="background:#faf7f0"><th style="text-align:left;padding:8px;border-bottom:2px solid #e7e0d2">Peça</th><th style="padding:8px;border-bottom:2px solid #e7e0d2">Qtd</th><th style="text-align:right;padding:8px;border-bottom:2px solid #e7e0d2">Preço</th><th style="text-align:right;padding:8px;border-bottom:2px solid #e7e0d2">Subtotal</th></tr>
        ${linhas}
      </table>
      <div style="margin-top:16px;margin-left:auto;width:290px">
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Subtotal</span><span>${BRL(o.itens.reduce((s,l)=>s+l.precoUnit*l.qtd,0))}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Desconto</span><span>− ${BRL(+o.descValor||0)}</span></div>
        ${(+o.frete||0)?`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Frete</span><span>+ ${BRL(+o.frete||0)}</span></div>`:''}
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid #c39b3f;font-size:20px;font-weight:800"><span>Total</span><span>${BRL(o.total)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;color:#8a8272"><span>Pagamento</span><span>${metodoLabel(o)}</span></div>
        ${parcela?`<div style="display:flex;justify-content:space-between;padding:4px 0;color:#8a8272"><span>Parcelas</span><span>${o.parcelas}x de ${BRL(parcela)}</span></div>`:''}
      </div>
      ${o.obs?`<p style="margin-top:16px;color:#8a8272"><b>Obs:</b> ${o.obs}</p>`:''}
      <p style="margin-top:26px;color:#8a8272;font-size:12px;border-top:1px solid #e7e0d2;padding-top:10px">Orçamento válido por ${loja.validade||7} dias · Valores sujeitos a alteração conforme cotação do ouro/dólar.</p>
    </div>`;
  window.print();
}

function gerarCobranca(n){
  const o=db.orcamentos.find(x=>x.numero===n);if(!o)return;
  const loja=db.params.loja||{};

let etiqFilter='TODOS', etiqSearch='', selEtiq={};
function viewEtiq(){
  const p=db.params.etiqueta||{};
  return `<h2 class="page">Etiquetas &middot; código de barras</h2>
  <p class="pg-sub">Gera o arquivo de impressão (TSPL) para a impressora térmica ${p.wmm}×${p.hmm}mm em ${p.ip}:${p.porta}. O código de barras é o <b>Código 2</b> da peça.</p>

      <div id="etiqPrev" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;max-height:44vh;overflow:auto"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn" onclick="baixarPRN()">&#11015; Baixar etiquetas (.prn)</button>
      </div>
      <p class="hint" style="margin-top:10px">Depois de baixar, dê 2 cliques no <b>enviador-etiquetas.bat</b> (mesma pasta) para imprimir na C3 Tech. A pré-visualização acima mostra como o código fica.</p>
    </div>
  </div>`;
}
function afterEtiq(){document.getElementById('etiqChips').innerHTML=chipsEtiq();refreshEtiqTable();}
function chipsEtiq(){const all=['TODOS',...TIPOS];return all.map(t=>`<span class="chip ${etiqFilter===t?'active':''}" onclick="etiqFilter='${t}';document.getElementById('etiqChips').innerHTML=chipsEtiq();refreshEtiqTable()">${t==='TODOS'?'Todos':t}</span>`).join('');}
function etiqRows(){let r=db.items.slice();if(etiqFilter!=='TODOS')r=r.filter(i=>(TIPOS.includes(i.tipo)?i.tipo:'OUTRO')===etiqFilter);if(etiqSearch.trim()){const q=etiqSearch.toLowerCase();r=r.filter(i=>[i.ref,i.cod,i.cod2].join(' ').toLowerCase().includes(q));}return r;}
function refreshEtiqTable(){
  const rows=etiqRows();
  const head=`<tr><th style="width:34px"></th><th>Código 2</th><th>Ref</th><th>Tipo</th><th class="right">Estoque</th><th class="right">Qtd etiq.</th></tr>`;
  const body=rows.map(i=>{const sel=selEtiq[i.id]!=null;return `<tr>
    <td><input type="checkbox" ${sel?'checked':''} onchange="toggleEtiq(${i.id},this.checked)"></td>
    <td><span class="code">${i.cod2||'—'}</span></td>
    <td>${i.ref||''}</td>
    <td><span class="pill t-${TIPOS.includes(i.tipo)?i.tipo:'OUTRO'}">${i.tipo}</span></td>
    <td class="right ${saldo(i)<=0?'neg':''}">${NUM(saldo(i))}</td>
    <td class="right"><input type="number" min="1" value="${sel?selEtiq[i.id]:1}" style="width:60px" ${sel?'':'disabled'} onchange="setEtiqQty(${i.id},this.value)"></td>
  </tr>`;}).join('');
  document.getElementById('etiqTable').innerHTML=head+body;
}
function toggleEtiq(id,on){if(on)selEtiq[id]=selEtiq[id]||1;else delete selEtiq[id];refreshEtiqTable();renderEtiqPrev();}
function setEtiqQty(id,v){selEtiq[id]=Math.max(1,+v||1);renderEtiqPrev();}
function marcarVisiveis(){etiqRows().forEach(i=>{if(!selEtiq[i.id])selEtiq[i.id]=1;});refreshEtiqTable();renderEtiqPrev();}
function renderEtiqPrev(){
  const ids=Object.keys(selEtiq);
  document.getElementById('etiqCount').textContent=ids.reduce((s,id)=>s+selEtiq[id],0)+' etiqueta(s)';
  const box=document.getElementById('etiqPrev');if(!box)return;
  box.innerHTML='';
  ids.slice(0,40).forEach(id=>{
    const it=itemById(+id);if(!it)return;const code=(codigoDe(it)||'').toString();
    const w=document.createElement('div');w.style.cssText='border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;text-align:center;width:150px';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    w.appendChild(svg);box.appendChild(w);
    try{JsBarcode(svg,code,{format:'CODE128',width:1.4,height:38,fontSize:12,margin:2,displayValue:true});}
    catch(e){w.innerHTML='<span style="color:var(--danger);font-size:11px">Código inválido:<br>'+code+'</span>';}
  });
  if(ids.length>40){const m=document.createElement('div');m.className='hint';m.textContent='+ '+(ids.length-40)+' peças (pré-visualização limitada a 40).';box.appendChild(m);}
}
function tsplEsc(s){return (s||'').toString().replace(/\\/g,'').replace(/"/g,'');}
function buildTSPL(){
  const p=db.params.etiqueta||{wmm:50,hmm:25,gapmm:2};
  let out='';
  Object.keys(selEtiq).forEach(id=>{
    const it=itemById(+id);if(!it)return;const code=tsplEsc(codigoDe(it));if(!code)return;
    out+=`SIZE ${p.wmm} mm,${p.hmm} mm\r\n`;
    out+=`GAP ${p.gapmm} mm,0 mm\r\n`;
    out+='DIRECTION 1\r\nREFERENCE 0,0\r\nCLS\r\n';
    out+=`BARCODE 40,20,"128",90,1,0,2,4,"${code}"\r\n`;
    out+=`PRINT 1,${selEtiq[id]}\r\n`;
  });
  return out;
}
function baixarPRN(){
  if(!Object.keys(selEtiq).length){alert('Selecione ao menos uma peça para etiquetar.');return;}
  const tspl=buildTSPL();
  const ts=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  dl(new Blob([tspl],{type:'application/octet-stream'}),'etiquetas-'+ts+'.prn');
  toast('Arquivo .prn gerado — rode o enviador-etiquetas.bat');
}

        </div>
        <div style="padding:12px 14px;border-bottom:1px dashed #999">
          <div style="font-size:11px;font-weight:700;color:#666;text-transform:uppercase">Remetente</div>
          <div style="font-weight:700">${loja.nome||'Lôjinha'}</div>
          <div style="font-size:13px">${loja.endereco||''}</div>
          <div style="font-size:13px">${loja.cnpj?'CNPJ: '+loja.cnpj:''}${loja.whatsapp?' · Tel: '+loja.whatsapp:''}</div>
        </div>
        <div style="padding:14px;background:#f7f7f7">
          <div style="font-size:11px;font-weight:700;color:#666;text-transform:uppercase">Destinatário</div>
          <div style="font-size:20px;font-weight:800">${s.nome||'—'}</div>
          <div style="font-size:15px;margin-top:2px">${s.endereco||''}</div>
          <div style="font-size:13px;margin-top:4px">${s.cpf?'CPF/CNPJ: '+s.cpf:''}${s.tel?' · Tel: '+s.tel:''}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:2px solid #111">
          <div style="font-size:13px">Volumes: <b>${s.volumes||1}</b>${s.peso?(' · Peso: <b>'+s.peso+' kg</b>'):''}</div>
          <svg id="shipBc"></svg>
        </div>
        ${s.obs?`<div style="padding:8px 14px;border-top:1px dashed #999;font-size:12px;color:#444">Obs: ${s.obs}</div>`:''}
      </div>
      <div style="text-align:center;color:#999;font-size:11px;margin-top:8px">Emitido em ${new Date().toLocaleString('pt-BR')} · Pedido ${s.orcNum||'—'}</div>
    </div>`;
  try{JsBarcode('#shipBc',codigo,{format:'CODE128',width:1.6,height:40,fontSize:12,margin:0});}catch(e){}
  window.print();
}
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:220;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close();},ok?90:220);}catch(e){}}
function findByCode(code){
  const n=normCode(code), ns=normNS(code);
  return db.items.find(i=>normCode(i.cod2)===n) || db.items.find(i=>normCode(i.cod)===n)
      || db.items.find(i=>normNS(i.cod2)===ns) || db.items.find(i=>normNS(i.cod)===ns)
      || db.items.find(i=>normCode(i.ref)===n);
}
function bipar(code){
  code=(code||'').trim();if(!code)return;
  const msg=document.getElementById('expMsg');
  const it=findByCode(code);
  if(!it){beep(false);msg.innerHTML=`<span style="color:var(--danger)">✕ Código não encontrado: ${code}</span>`;return;}
  if(saldo(it)<=0){beep(false);msg.innerHTML=`<span style="color:var(--danger)">✕ ${codigoDe(it)} está sem estoque</span>`;renderExped();return;}
  const mov={id:Date.now()+Math.random(),itemId:it.id,tipo:'saida',qtd:1,data:new Date().toISOString().slice(0,10),motivo:'Expedição',obs:'Bipagem'};
  db.movimentos.push(mov);expedSession.push({itemId:it.id,movId:mov.id});save();
  beep(true);msg.innerHTML=`<span style="color:var(--ok)">✔ Baixa registrada: <span class="code">${codigoDe(it)}</span> · ${it.tipo} (saldo ${NUM(saldo(it))})</span>`;
  renderExped();
}
function biparManual(){const i=document.getElementById('expInput');bipar(i.value);i.value='';i.focus();}
function undoExped(itemId){
  for(let k=expedSession.length-1;k>=0;k--){if(expedSession[k].itemId===itemId){const movId=expedSession[k].movId;db.movimentos=db.movimentos.filter(m=>m.id!==movId);expedSession.splice(k,1);break;}}
  save();renderExped();
}
function renderExped(){
  const t=document.getElementById('expTable');if(!t)return;
  const grp={};expedSession.forEach(e=>{grp[e.itemId]=(grp[e.itemId]||0)+1;});
  const ids=Object.keys(grp);
  document.getElementById('expTot').textContent=expedSession.length+' unidade(s)';
  t.innerHTML=`<tr><th>Código 2</th><th>Ref / Tipo</th><th class="right">Bipado</th><th class="right">Saldo atual</th><th class="noprint"></th></tr>`+
    (ids.length?ids.map(id=>{const it=itemById(+id);return `<tr>
      <td><span class="code">${it?codigoDe(it):'?'}</span></td>
      <td>${it?(it.ref||'')+' · '+it.tipo:''}</td>
      <td class="right"><b>${grp[id]}</b></td>
      <td class="right ${it&&saldo(it)<=0?'neg':''}">${it?NUM(saldo(it)):''}</td>
      <td class="right noprint"><button class="mini" onclick="undoExped(${id})">desfazer 1</button></td>
    </tr>`;}).join(''):'<tr><td colspan="5" class="hint center">Nenhuma peça bipada ainda.</td></tr>');
}
function finalizarExped(){if(expedSession.length&&!confirm('Concluir? As baixas já foram registradas no estoque. Isto apenas limpa a lista da tela.'))return;expedSession=[];renderExped();const i=document.getElementById('expInput');if(i)i.focus();toast('Expedição concluída');}

/* ============ CATÁLOGO DO CLIENTE ============ */
function generateCatalog(){
  const loja=db.params.loja||{};
  const inStock=db.items.filter(i=>saldo(i)>0);
  if(!inStock.length){alert('Não há peças em estoque para montar o catálogo. Registre entradas no Estoque primeiro.');return;}
  const itens=inStock.map(i=>({ref:codigoDe(i),cod:i.cod||'',tipo:(TIPOS.includes(i.tipo)?i.tipo:'OUTRO'),foto:i.foto||'',brl:+precoBRL(i).toFixed(2),usd:+precoUSD(i).toFixed(2),estoque:saldo(i)}));
  const data={loja:{nome:loja.nome||'Lôjinha',whats:(loja.whatsapp||'').replace(/\D/g,''),validade:loja.validade||7},usd:db.params.usd,itens};
  const src=decodeURIComponent(CATALOG_ENC).replace('__DATA__',()=>JSON.stringify(data));
  dl(new Blob([src],{type:'text/html;charset=utf-8'}),'Catalogo-Lojinha.html');
  toast(itens.length+' peça(s) no catálogo gerado');
}

/* ============ IMPORT/EXPORT ============ */
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});dl(blob,'olojinha-backup-'+new Date().toISOString().slice(0,10)+'.json');}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=migrate(JSON.parse(r.result));save();render();toast('Backup restaurado');}catch(e){alert('Arquivo inválido');}};r.readAsText(f);inp.value='';}
function exportCSV(){
  const h=['Kit','Tipo','Codigo2','Referencia','CodEtiqueta','Fornecedor','PesoG','Bruto','Metal','Embalagem','Custo','Markup','PrecoBRL','PrecoUSD','SaldoInicial','SaldoAtual','Foto'];
  const rows=cadRows().map(i=>[i.kit||'',i.tipo,i.cod2,i.ref,i.cod,i.fornecedor,i.pesoG,i.bruto,i.metal,i.embalagem,custo(i).toFixed(2),markupOf(i),precoBRL(i).toFixed(2),precoUSD(i).toFixed(2),i.saldoInicial,saldo(i),i.foto].map(c=>`"${(c==null?'':c).toString().replace(/"/g,'""')}"`).join(';'));
  dl(new Blob(['\ufeff'+[h.join(';'),...rows].join('\n')],{type:'text/csv'}),'olojinha-catalogo.csv');
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

renderNav();render();
</script>
